<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBFCFE"/><stop offset="1" stop-color="#F1F6FB"/></linearGradient>
    <radialGradient id="blobBlue" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8CC8F2" stop-opacity="0.55"/><stop offset="1" stop-color="#8CC8F2" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobGold" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFD54A" stop-opacity="0.38"/><stop offset="1" stop-color="#FFD54A" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#CBD5E1" fill-opacity="0.55"/></pattern>
    <linearGradient id="logoBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8CC8F2"/><stop offset="1" stop-color="#2F7FC8"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD54A"/><stop offset="1" stop-color="#F2A900"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F7FC8" stop-opacity="0.22"/><stop offset="1" stop-color="#2F7FC8" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0F2A47" flood-opacity="0.12"/></filter>
    <filter id="shadowSm" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F2A47" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#dots)"/>
  <circle cx="1040" cy="170" r="420" fill="url(#blobBlue)"/>
  <circle cx="180" cy="690" r="360" fill="url(#blobGold)"/>

  <!-- brand -->
  <g transform="translate(88 92)">
    <g transform="scale(0.1)">
      <circle cx="256" cy="256" r="256" fill="url(#logoBg)"/>
      <g transform="rotate(-12 256 256)">
        <path d="M150 170 h170 a24 24 0 0 1 17 7 l64 64 a24 24 0 0 1 0 34 l-64 64 a24 24 0 0 1 -17 7 h-170 a24 24 0 0 1 -24 -24 v-128 a24 24 0 0 1 24 -24 z" fill="#FFFFFF"/>
        <circle cx="352" cy="258" r="15" fill="#2F7FC8"/>
        <polyline points="168,300 210,268 244,282 300,212" fill="none" stroke="url(#sun)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="300" cy="212" r="17" fill="url(#sun)"/>
      </g>
    </g>
    <text x="64" y="37" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0F172A">Índice</text>
  </g>

  <!-- live chip -->
  <g transform="translate(88 178)">
    <rect width="292" height="40" rx="20" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="22" cy="20" r="6" fill="#22C55E"/>
    <text x="38" y="26" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#334155">En vivo en Celo mainnet · wARS</text>
  </g>

  <!-- headline -->
  <text font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="800" fill="#0F172A" font-size="66">
    <tspan x="86" y="310">La inflación de</tspan>
    <tspan x="86" y="388">Argentina, todos</tspan>
    <tspan x="86" y="466">los <tspan fill="#2F7FC8">días.</tspan></tspan>
  </text>
  <text font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" font-weight="500" fill="#475569">
    <tspan x="88" y="530">Hecha por la gente. Cada precio confirmado</tspan>
    <tspan x="88" y="564">se paga en pesos digitales.</tspan>
  </text>
  <g transform="translate(88 600)">
    <rect width="250" height="54" rx="14" fill="#0F172A"/>
    <text x="125" y="35" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">@IndiceDiarioBot</text>
  </g>

  <!-- product card: index -->
  <g transform="translate(700 120)" filter="url(#shadow)">
    <rect width="470" height="300" rx="26" fill="#FFFFFF" stroke="#E8EEF5"/>
    <text x="32" y="52" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#64748B">Índice · hoy</text>
    <text x="32" y="118" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="58" font-weight="800" fill="#0F172A">101,8</text>
    <g transform="translate(212 80)"><rect width="98" height="34" rx="17" fill="#FEF3C7"/><text x="49" y="23" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#B45309">▲ 0,06%</text></g>
    <path d="M32 250 L92 236 L152 242 L212 214 L272 220 L332 190 L392 176 L438 158 L438 272 L32 272 Z" fill="url(#area)"/>
    <polyline points="32,250 92,236 152,242 212,214 272,220 332,190 392,176 438,158" fill="none" stroke="#2F7FC8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="438" cy="158" r="7" fill="url(#sun)" stroke="#FFFFFF" stroke-width="3"/>
    <text x="438" y="56" text-anchor="end" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#94A3B8">11 productos</text>
  </g>

  <!-- product card: chat -->
  <g transform="translate(640 420)" filter="url(#shadow)">
    <rect width="380" height="210" rx="24" fill="#FFFFFF" stroke="#E8EEF5"/>
    <g transform="translate(150 28)"><rect width="200" height="46" rx="16" fill="#2F7FC8"/><text x="100" y="30" text-anchor="middle" font-family="Consolas, Segoe UI, monospace" font-size="18" font-weight="600" fill="#FFFFFF">leche 1450 coto</text></g>
    <g transform="translate(28 92)"><rect width="300" height="88" rx="16" fill="#F1F5F9"/>
      <circle cx="26" cy="30" r="11" fill="#22C55E"/><path d="M20 30 l4 4 l8 -9" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="46" y="36" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#0F172A">Confirmado</text>
      <text x="18" y="68" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#475569">Otra persona vio el mismo precio</text>
    </g>
  </g>

  <!-- payment toast -->
  <g transform="translate(990 470)" filter="url(#shadowSm)">
    <rect width="230" height="96" rx="20" fill="#0F172A"/>
    <circle cx="40" cy="48" r="20" fill="url(#sun)"/>
    <text x="40" y="55" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#0F172A">$</text>
    <text x="74" y="44" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">+50 wARS</text>
    <text x="74" y="70" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#94A3B8">pagado en Celo</text>
  </g>
</svg>
